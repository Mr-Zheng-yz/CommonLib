plugins {
    alias(libs.plugins.android.library)
    id 'maven-publish'
}

android {
    namespace 'com.example.mq_lib'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // 声明发布 release 变体，否则 components.release 不存在
    publishing {
        singleVariant('release')
    }
}

// JitPack 发布配置：JitPack 构建时会执行 publishToMavenLocal，
// 坐标为 com.github.Mr-Zheng-yz.CommonLib:mq-lib:<git tag>
// version 统一取自 gradle.properties 的 RELEASE_VERSION，必须与 git tag 一致
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.Mr-Zheng-yz.CommonLib'
                artifactId = 'mq-lib'
                version = findProperty('RELEASE_VERSION')
            }
        }
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    api project(":common-libs")
    api 'com.rabbitmq:amqp-client:4.0.0.RC2'
}