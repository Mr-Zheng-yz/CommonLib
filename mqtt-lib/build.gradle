plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    id 'maven-publish'
}

android {
    namespace 'com.baize.mqtt_lib'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()

        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            // 库模块发布前混淆：公开 API 由 proguard-rules.pro 保留，内部实现被混淆
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // 显式声明发布 release 变体且不附带 sources jar
    publishing {
        singleVariant('release')
    }
}

// JitPack 多模块标准坐标：com.github.用户名.仓库名:模块名:git tag
// version 统一取自 gradle.properties 的 RELEASE_VERSION，必须与 git tag 一致
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.Mr-Zheng-yz.CommonLib'
                artifactId = 'mqtt-lib'
                version = findProperty('RELEASE_VERSION')
            }
        }
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    api project(":common-libs")
    api 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.2'
//    api 'org.eclipse.paho:org.eclipse.paho.android.service:1.1.1'
}